- name: Download Composer installer
  get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-installer.php

- name: Install Composer globally
  command: php /tmp/composer-installer.php --install-dir=/usr/local/bin --filename=composer creates=/usr/local/bin/composer

- name: Remove Composer installer
  file:
    path: /tmp/composer-installer.php
    state: absent

- name: Verify Composer installation
  command: composer --version
  register: composer_version
  changed_when: false

- name: Show Composer version
  debug:
    msg: "Composer version is {{ composer_version.stdout }}"